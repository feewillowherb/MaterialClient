name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore MaterialClient.sln

    - name: Build
      run: dotnet build MaterialClient.sln --no-restore -c Release -p:WarningLevel=0

    - name: Run unit tests
      run: dotnet test MaterialClient.Common.Tests --no-build -c Release --verbosity normal

  publish:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: dotnet publish MaterialClient\MaterialClient.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaterialClient-win-x64
        path: MaterialClient\bin\Release\net10.0\win-x64\publish\*
